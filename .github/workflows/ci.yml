name: CI

# Builds angelsea against AngelScript 2.37, 2.38 and 2.39 and checks it two ways:
#  - the Catch2 suite (benchmarks excluded);
#  - the differential host: the same scripts on the plain VM and with the JIT must print the same output,
#    on a fixed corpus and on scripts generated from a seed.
# A change that only touches documentation builds nothing; a branch with a pull request builds once, and a
# newer run of the same branch cancels the older one.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: AngelScript ${{ matrix.angelscript }} (${{ matrix.target.os }} ${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.target.experimental }}
    strategy:
      fail-fast: false
      matrix:
        angelscript: ['2.39.0', '2.38.0', '2.37.0']
        target:
          - {runner: ubuntu-24.04, os: linux, arch: x64, experimental: false}
          - {runner: windows-2025, os: windows, arch: x64, experimental: false}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, experimental: true}
          - {runner: macos-15, os: macos, arch: arm64, experimental: true}
          - {runner: macos-15-intel, os: macos, arch: x64, experimental: true}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.target.os == 'windows'
      - name: Install Ninja
        shell: bash
        run: python -m pip install ninja
      - name: Reuse the downloaded release
        if: matrix.angelscript != '2.39.0'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk-cache
          key: angelcode-${{ matrix.angelscript }}
      - name: Fetch a patched SDK for 2.37 and 2.38
        if: matrix.angelscript != '2.39.0'
        shell: bash
        run: |
          git clone --depth 1 --branch v0.1.0 https://github.com/angelscript-tools/angelscript-engine "$RUNNER_TEMP/engine"
          sdk=$(python "$RUNNER_TEMP/engine/scripts/prepare-sdk.py" ${{ matrix.angelscript }} --out "$RUNNER_TEMP/sdk" --cache "$RUNNER_TEMP/sdk-cache")
          echo "SDK_ARG=-DASEA_ANGELSCRIPT_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DASEA_ENABLE_TESTING=ON $SDK_ARG
      - name: Build
        shell: bash
        run: cmake --build build
      - name: Catch2 suite
        shell: bash
        working-directory: tests
        run: ../build/tests/angelsea-tests "~[benchmark]"
      - name: Differential test
        shell: bash
        working-directory: tests
        run: |
          for seed in 1 2 3; do
            python differential/generate.py --seed "$seed" --count 120 --out "$RUNNER_TEMP/gen$seed"
            ../build/tests/angelsea-differential "$RUNNER_TEMP/gen$seed"
          done
          # The scripts of the Catch2 suite hold several test functions each: --all runs every `void f()`.
          ctest --test-dir ../build/tests -R differential --output-on-failure

  # MIR has no 32-bit backend: these jobs build without it and check the ahead-of-time path only.
  x86-linux:
    name: AOT only (linux x86, 32-bit container)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and check the AOT corpus
        run: docker run --rm -v "$PWD:/src:ro" i386/debian:12 sh /src/tests/aot/ci-i386.sh

  x86-windows:
    name: AOT only (windows x86)
    runs-on: windows-2025
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Install Ninja
        shell: bash
        run: python -m pip install ninja
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DASEA_ENABLE_TESTING=ON
      - name: Build
        shell: bash
        run: cmake --build build --target angelsea-differential
      - name: AOT corpus
        shell: bash
        run: CC=cl EXT=dll sh tests/aot/run.sh build/tests/angelsea-differential.exe "$RUNNER_TEMP/aot"
